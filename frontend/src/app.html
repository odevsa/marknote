<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#18181b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="MarkNote" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MarkNote</title>
    %sveltekit.head%
    <script>
      // Early theme detection to prevent flash of unstyled content
      try {
        const savedTheme =
          localStorage.getItem("marknote_theme") ||
          localStorage.getItem("memomark_theme") ||
          "system";
        const root = document.documentElement;
        if (savedTheme === "system") {
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          root.setAttribute("data-theme", prefersDark ? "dark" : "light");
        } else {
          root.setAttribute("data-theme", savedTheme);
        }
      } catch (e) {}
    </script>
  </head>
  <body
    class="bg-[var(--bg-primary)] text-[var(--text-primary)] antialiased min-h-screen overflow-hidden"
  >
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
